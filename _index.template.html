<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ポケットカード</title>
<meta name="description" content="救急・集中治療の臨床ポケットカード集">
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#0e7c86" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f5f7fa;
    --ink: #1a2230;
    --ink-2: #45526a;
    --ink-3: #6b7890;
    --line: #dde3ec;
    --line-strong: #c6cfdd;
    --accent: #0e7c86;
    --accent-soft: #d9edef;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 4px 16px rgba(20,30,50,.05);
    --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141b; --surface: #191f29; --surface-2: #1f2732;
      --ink: #e7ecf3; --ink-2: #aeb9ca; --ink-3: #7d8aa0;
      --line: #2a323f; --line-strong: #38424f;
      --accent: #3fb3bd; --accent-soft: #123037;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  header.hero { padding: 12px 4px 20px; }
  header.hero h1 {
    margin: 0 0 6px; font-size: 25px; font-weight: 800; letter-spacing: .01em;
  }
  header.hero p { margin: 0; color: var(--ink-3); font-size: 13.5px; }

  section + section { margin-top: 28px; }
  h2.sec {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 0 0 11px; padding: 0 4px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 14px; font-weight: 800; letter-spacing: .06em; color: var(--ink-2);
  }
  h2.sec span {
    font-size: 11.5px; font-weight: 500; letter-spacing: 0; color: var(--ink-3);
  }

  .grid { display: grid; gap: 12px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 15px 16px 16px;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .12s ease, transform .08s ease;
  }
  a.card:active { transform: scale(.988); border-color: var(--accent); }
  @media (hover: hover) {
    a.card:hover { border-color: var(--line-strong); }
  }
  a.card .tag {
    display: inline-block; margin-bottom: 8px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 999px;
  }
  a.card h2 {
    margin: 0 0 6px; font-size: 17.5px; font-weight: 700; line-height: 1.4;
    display: flex; align-items: baseline; gap: 8px;
  }
  a.card h2::after {
    content: "›"; margin-left: auto; color: var(--ink-3);
    font-size: 22px; font-weight: 400; line-height: 1;
  }
  a.card p {
    margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.65;
  }

  .note {
    margin-top: 26px; padding: 13px 15px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink-3); font-size: 12.5px; line-height: 1.7;
  }
  .note b { color: var(--ink-2); }

  #install {
    display: none; width: 100%; margin: 18px 0 0;
    padding: 13px 16px; border: 1px solid var(--accent); border-radius: var(--radius);
    background: var(--accent-soft); color: var(--accent);
    font: 700 14.5px var(--sans); cursor: pointer;
  }

  footer {
    margin-top: 30px; text-align: center;
    color: var(--ink-3); font-size: 11.5px; line-height: 1.8;
  }
  #status { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>ポケットカード</h1>
    <p>救急・集中治療の臨床メモ／オフラインで動きます</p>
  </header>

  <main>
<!--SECTIONS-->
  </main>

  <button id="install" type="button">ホーム画面に追加する</button>

  <div class="note">
    <b>使い方</b> — Chrome のメニュー（⋮）から「アプリをインストール」または「ホーム画面に追加」を選ぶと、
    アイコンから直接開けるようになります。一度開いたカードは端末に保存され、
    <b>電波の無い病棟でも表示できます</b>。<br>
    <b>免責</b> — 個人的な学習用のまとめです。実際の診療判断は各施設のプロトコル・最新のガイドライン・
    添付文書を確認のうえ、担当医の責任で行ってください。患者情報は一切含みません。
  </div>

  <footer>
    <span id="status">オフライン対応の準備中…</span>
  </footer>

</div>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var installBtn = document.getElementById('install');

  if ('serviceWorker' in navigator) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function () {
        statusEl.textContent = navigator.onLine
          ? 'オフラインで利用できます'
          : 'オフライン表示中';
      }).catch(function () {
        statusEl.textContent = 'オフライン保存は利用できません';
      });
    });
  } else {
    statusEl.textContent = 'このブラウザはオフライン保存に非対応です';
  }

  // Android Chrome のインストールプロンプト
  var deferred = null;
  addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () {
      deferred = null;
      installBtn.style.display = 'none';
    });
  });
  addEventListener('appinstalled', function () {
    installBtn.style.display = 'none';
  });
})();
</script>
</body>
</html>
